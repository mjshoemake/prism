spring.application.name=api
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/playpen
spring.datasource.username=postgres
# Password from the environment, never committed: PRISM_DB_PASSWORD, else PGPASSWORD (same as psql), else empty.
spring.datasource.password=${PRISM_DB_PASSWORD:${PGPASSWORD:}}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000


# ---- Logging ---------------------------------------------------------------------------------
# Categories: com.prism.common.logging.LogCategory.  Destinations: logback-spring.xml.
# Levels: TRACE < DEBUG < INFO < WARN < ERROR < OFF.  A class can be tuned on its own,
# e.g. logging.level.Service.UsersService=DEBUG.
# Override at launch:  java -jar target/prism-api-1.0.0.jar --logging.level.SQL=DEBUG
# (Use properties or command-line flags, not environment variables: env-var names are
#  lower-cased and logger names are case-sensitive.)
prism.logging.dir=logs
logging.level.root=INFO
logging.level.Application=INFO
logging.level.Controller=DEBUG
logging.level.Service=INFO
logging.level.SQL=INFO
logging.level.Audit=INFO
logging.level.Performance=INFO
logging.level.ResultSet=DEBUG
logging.level.Core=INFO

# ---- Static UI caching -------------------------------------------------------------------------
# Files inside the jar carry a fixed timestamp, so Last-Modified never changes and browsers keep a
# stale index.html (old UI) after a rebuild. Disable Last-Modified and make browsers re-fetch.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true

# Metric metadata cache (Metrics, Focus_Levels): reloaded when older than this. Metadata rarely changes.
prism.metadata.cache-ttl=15m

# ---- MCP server: Prism Advisor (docs/MCP.md) ----------------------------------------------------
# Off by default. Turn on for a local run:  java -jar target/prism-api-1.0.0.jar --prism.mcp.enabled=true
# Endpoint: http://localhost:8080/mcp (Streamable HTTP). Local use only until authentication exists.
prism.mcp.enabled=false
spring.ai.mcp.server.enabled=${prism.mcp.enabled}
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=prism-advisor
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Prism Advisor: helps teams get value out of Prism, a drill-down metrics tool for \
  software delivery. Read the prism://guide resources for Prism's rules (metric types, ratio of sums) and use \
  draft_metric to turn a metric idea into a Prism metric definition. It never queries any database.
